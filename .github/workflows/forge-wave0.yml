name: Forge Wave 0 Verification

on:
  pull_request:
    branches: [main]

concurrency:
  group: forge-wave0-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  app-builds:
    name: Build Master + Central
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            central-dias-main/package-lock.json
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Build Master
        run: npm run build
      - name: Install Central dependencies
        working-directory: central-dias-main
        run: npm install --no-audit --no-fund
      - name: Build Central
        working-directory: central-dias-main
        run: npm run build

  database-verification:
    name: Supabase migrations + DB tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start isolated Supabase
        run: npx --yes supabase@2.98.2 start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Apply all migrations from zero
        run: npx --yes supabase@2.98.2 db reset
      - name: Run exception-based database tests
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql --version
          for test_file in supabase/tests/*.sql; do
            echo "::group::${test_file}"
            psql "${DB_URL}" --set=ON_ERROR_STOP=1 --file="${test_file}"
            echo "::endgroup::"
          done
      - name: Stop isolated Supabase
        if: always()
        run: npx --yes supabase@2.98.2 stop --no-backup || true
