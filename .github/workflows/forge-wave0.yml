name: Forge Wave 0 Verification

on:
  pull_request:
    branches: [main]

# Zero-cost safety mode:
# - public repository + standard ubuntu-latest runners;
# - no cloud Supabase branch/project;
# - no production credentials or remote migrations;
# - no uploaded workflow artifacts/cache.
permissions:
  contents: read

concurrency:
  group: forge-wave0-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  app-builds:
    name: Build Master + Central
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard token-free browser handoff
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.ts' --include='*.tsx' 'sso_token' src; then
            echo "Master source must not build or consume sso_token URLs." >&2
            exit 1
          fi
          if grep -nE 'sso_token|refresh_token' \
            central-dias-main/src/routes/login.tsx \
            central-dias-main/src/lib/clientHandoff.ts; then
            echo "Central secure handoff path must not consume raw Supabase tokens from URLs." >&2
            exit 1
          fi
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Build Master
        run: npm run build
      - name: Install Central dependencies
        working-directory: central-dias-main
        run: npm install --no-audit --no-fund
      - name: Create CI-only placeholders for missing legacy local seed files
        shell: bash
        run: |
          set -euo pipefail
          seed_dir="central-dias-main/supabase/migrations"
          mkdir -p "${seed_dir}"
          for file in \
            202606100002_reset_fleet_from_spreadsheet.sql \
            202606150001_refresh_trailers_from_final_fleet_sheet.sql \
            202606150004_refresh_vehicle_metadata_from_final_fleet_sheet.sql \
            202606150005_refresh_driver_phones_from_final_fleet_sheet.sql
          do
            path="${seed_dir}/${file}"
            if [[ ! -e "${path}" ]]; then
              printf '%s\n' '-- CI-only empty placeholder. Never deploy or use as production data.' > "${path}"
            fi
          done
      - name: Build Central
        working-directory: central-dias-main
        run: npm run build

  database-verification:
    name: Ephemeral Supabase + DB tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert local-only verification
        shell: bash
        run: |
          set -euo pipefail
          echo "FROTAK LAB uses only 127.0.0.1 in this job."
          test ! -f supabase/.temp/project-ref || {
            echo "Refusing linked Supabase project in zero-cost CI lab." >&2
            exit 1
          }
      - name: Start isolated Supabase
        run: npx --yes supabase@2.98.2 start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Apply all migrations from zero
        run: npx --yes supabase@2.98.2 db reset
      - name: Start local handoff Edge Function
        shell: bash
        run: |
          set -euo pipefail
          # Deliberately rely on supabase/config.toml here. If the committed
          # [functions.client-handoff] gateway policy is wrong, this E2E must fail.
          npx --yes supabase@2.98.2 functions serve client-handoff > /tmp/client-handoff.log 2>&1 &
          echo $! > /tmp/client-handoff.pid
          for attempt in $(seq 1 45); do
            if curl --silent --fail --request OPTIONS \
              http://127.0.0.1:54321/functions/v1/client-handoff \
              >/dev/null 2>&1; then
              echo "client-handoff is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/client-handoff.log >&2 || true
          exit 1
      - name: Run exception-based database tests
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql --version
          for test_file in supabase/tests/*.sql; do
            echo "::group::${test_file}"
            psql "${DB_URL}" --set=ON_ERROR_STOP=1 --file="${test_file}"
            echo "::endgroup::"
          done
      - name: Run client handoff end-to-end test
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx --yes supabase@2.98.2 status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          export API_URL ANON_KEY
          export DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          bash supabase/tests/wave0_client_handoff.sh
      - name: Show handoff function log on failure
        if: failure()
        run: cat /tmp/client-handoff.log || true
      - name: Stop isolated Supabase
        if: always()
        run: npx --yes supabase@2.98.2 stop --no-backup || true
